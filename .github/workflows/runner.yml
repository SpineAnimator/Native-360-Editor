name: Private Native 360 executor
on:
  workflow_dispatch:
  repository_dispatch:
    types: [native-360-editor]
permissions:
  contents: read
concurrency:
  group: private-native-360-executor
  cancel-in-progress: false
jobs:
  runner-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          set -euo pipefail
          echo "Public ephemeral runner allocated: $RUNNER_NAME ($RUNNER_OS)"
          uname -s
  execute-private-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout private source from 3Spine-core
        uses: actions/checkout@v4
        with:
          repository: vladleopold/3Spine-core
          ref: main
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: private-source
          persist-credentials: false
          sparse-checkout: |
            scripts/verify_volume360_editor_linux.py
            scripts/audit_volume360_visual.py
            scripts/create_editor360_review_sheets.py
            tests/test_audit_volume360_visual.py
            tests/test_audit_volume360_review.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run private Native 360 regression tests
        working-directory: private-source
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'Pillow>=10.3,<14'
          python -m unittest discover -s tests -p 'test_audit_volume360_*.py'
